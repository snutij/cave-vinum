name: Refresh Cave Vinum

# Each day, this workflow updates time_stamp.txt and commits it to the default branch.
# Connected build services can use the commit to rebuild the report.
# The automatically provided GITHUB_TOKEN is sufficient to push.

on:
  schedule:
    - cron: "23 4 * * *" # Daily at 04:23 UTC (05:23 or 06:23 in Paris)
  workflow_dispatch: # Manually refresh after editing the spreadsheet

permissions:
  contents: write

concurrency:
  group: cave-vinum
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Update time_stamp.txt
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > time_stamp.txt

      # Do not add "[skip ci]" to this commit message; build services may skip the commit.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add time_stamp.txt
          git commit -m "Refresh wine cellar ($(cat time_stamp.txt))"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (branch changed meanwhile); retry ${attempt}/3..."
            sleep 5
            git pull --rebase
          done
          exit 1
